name: Enforce Dotnet Format
on:
  - push

jobs:
  build-and-test:
    name: dotnet linting
    runs-on: ubuntu-latest
    steps:
      - name: 📩 checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 🔍 dotnet linting
        working-directory: src
        run: |
          dotnet restore
          dotnet build --no-restore
          dotnet format --verify-no-changes
