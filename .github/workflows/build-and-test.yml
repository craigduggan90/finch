name: Build and Test
on:
  - push

jobs:
  build-and-test:
    name: build and test project
    runs-on: ubuntu-latest
    steps:
      - name: 📩 checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: ☁️ install tools
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: 🔨 build solution
        working-directory: src/api
        run: |
          dotnet restore
          dotnet build --no-restore

      - name: 🧪 run tests
        working-directory: src
        run: |
          dotnet test ./Finch.sln --configuration Release --collect "XPlat Code Coverage"
          reportgenerator -reports:"**/coverage.cobertura.xml" -targetdir:./../coverage/api -reporttypes:MarkdownSummaryGithub

      - name: 💾 publish coverage report
        uses: actions/upload-artifact@v7
        with:
          name: CoverageReport
          path: coverage/api/SummaryGithub.md
